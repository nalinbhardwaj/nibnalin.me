# Site settings
title: "Nalin"
description: "Nalin's personal website."

author: Nalin
email: nalinbhardwaj@nibnalin.me
twitter_username: nibnalin
github_username: nalinbhardwaj

baseurl: "" # the subpath of your site, e.g. /blog
url: "https://nibnalin.me" # the base hostname & protocol for your site

# Build settings
include: [_pages]
markdown: kramdown
permalink: /:title.html

# Old posts lived at /dust-nib/:title.html — jekyll-redirect-from keeps those
# URLs alive (each post declares its old path via `redirect_from`).
plugins:
  - jekyll-redirect-from

kramdown:
    math-engine: katex

sass:
    style: compressed

exclude: [vendor]
