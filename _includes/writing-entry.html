{%- if include.entry.url -%}
<li><a class="entry" href="{{ include.entry.url }}">
  <span class="entry__year">{{ include.entry.year }}</span>
  <span class="entry__title">{{ include.entry.title }} <span class="entry__ext">&#8599;</span></span>
</a></li>
{%- else -%}
{%- assign post = site.posts | where: "slug", include.entry.slug | first -%}
{%- if post -%}
<li><a class="entry" href="{{ post.url | prepend: site.baseurl }}">
  <span class="entry__year">{{ post.date | date: "%Y" }}</span>
  <span class="entry__title">{{ post.title }}</span>
</a></li>
{%- endif -%}
{%- endif -%}
